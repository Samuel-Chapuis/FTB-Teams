dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

	modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

	modApi "dev.ftb.mods:ftb-library:${rootProject.ftb_library_version}"
}

architectury {
	common(/*"forge",*/ "fabric", "neoforge")
}

processResources {
	// Keep original Blockbench exports for editing, but only ship normalized lowercase models.
	exclude 'assets/ftbteams/models/block/PopBed*.json'
}

tasks.register('enclosureScannerTest', JavaExec) {
	group = 'verification'
	description = 'Run the bounded enclosure flood-fill regression tests.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.ftb.mods.ftbteams.world.block.EnclosureScannerTest'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.named('check') {
	dependsOn enclosureScannerTest
	dependsOn 'enclosurePreviewTest'
	dependsOn 'minionAssignmentsTest'
}

tasks.register('minionAssignmentsTest', JavaExec) {
	group = 'verification'
	description = 'Verify persistent one-bed/one-minion assignment invariants.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.ftb.mods.ftbteams.world.entity.MinionAssignmentsTest'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.register('enclosurePreviewTest', JavaExec) {
	group = 'verification'
	description = 'Verify camera-facing cut planes and interpolated preview geometry.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.ftb.mods.ftbteams.client.gui.PreviewGeometryTest'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

publishing {
	publications {
		mavenCommon(MavenPublication) {
			artifactId = rootProject.archivesBaseName
			version ftbPublishing.mavenVersion
			from components.java
		}
	}
}
